[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pair-representation-scaling"
version = "1.0.0"
requires-python = ">=3.10,<3.13"
description = "Pair Representation Scaling — β-grid conformational sampling for Boltz-2 and AlphaFold 3"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Shosuke Suzuki", email = "begonia.sp.13@gmail.com"},
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
boltz = [
    "boltz @ file://localhost/${PROJECT_ROOT}/third_party/boltz",
]
lint = ["ruff"]
dev = ["pytest>=7.0"]

[project.scripts]
prs = "prs.cli:cli"

[project.urls]
Homepage = "https://github.com/suzuki-2001/pair-representation-scaling"
Issues = "https://github.com/suzuki-2001/pair-representation-scaling/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["prs*"]

[tool.ruff]
src = ["src"]
target-version = "py310"
lint.select = ["E", "F", "W", "I", "B", "UP"]
lint.ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
